[package]
name = "bicameral"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/bicameral"
homepage = "https://github.com/savageAZfck/bicameral"
license = "MIT"
description = "Bicameral minds: consequential decisions require signed concurrence from independent reasoning chambers — GPU brain and ANE brain — with dissent preserved in a hash-chained hansard"
keywords = ["governance", "concurrence", "dual-brain", "sovereignty", "agents"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rand = "0.8"

[features]
default = []
